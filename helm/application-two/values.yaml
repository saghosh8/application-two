replicaCount: 2

image:
  repository: ghcr.io/example/application-two
  tag: "2.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: nginx
  host: application-two.example.com

resources:
  requests:
    cpu: 150m
    memory: 256Mi
  limits:
    cpu: 750m
    memory: 768Mi

environment:
  SPRING_PROFILES_ACTIVE: dev
  APP_VERSION: "2.0.0"

features:
  notification: true
  audit: true
  databaseChange: false

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
