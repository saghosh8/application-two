name: CD - UAT

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. commit short SHA from CI, or "latest")'
        required: true
        default: 'latest'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show inputs
        run: |
          {
            echo "### Run details"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| repository | ${{ github.event.repository.name }} |"
            echo "| branch | ${{ github.ref_name }} |"
            echo '${{ toJSON(github.event.inputs) }}' | jq -r '(. // {}) | to_entries[] | select(.key != "branch") | "| \(.key) | \(.value) |"'
          } >> $GITHUB_STEP_SUMMARY

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: demo-uat

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create uat namespace
        run: kubectl create namespace uat --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy chart to uat
        run: |
          helm upgrade --install ${{ github.event.repository.name }} ./helm/${{ github.event.repository.name }} \
            -f ./helm/${{ github.event.repository.name }}/values-uat.yaml \
            --namespace uat \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set fullnameOverride=${{ github.event.repository.name }} \
            --set image.tag=${{ github.event.inputs.image_tag }} \
            --wait --timeout 90s

      - name: Show what got deployed
        run: |
          echo "=== Pods in uat ==="
          kubectl get pods -n uat -o wide
          echo
          echo "=== Deployment summary ==="
          kubectl get deployment,svc,hpa -n uat
          echo
          echo "=== Replica count (from values-uat.yaml) ==="
          kubectl get deployment ${{ github.event.repository.name }} -n uat -o jsonpath='{.spec.replicas}'
