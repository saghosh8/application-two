name: CD - Dev

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. commit short SHA from CI, or "latest")'
        required: true
        default: 'latest'
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - 'feature/**'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    # For a manual run, always proceed. For an auto-run after CI, only proceed if CI succeeded.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run does not checkout the triggering commit by default - set it explicitly
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve image tag
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-7)"
          else
            TAG="${{ github.event.inputs.image_tag }}"
          fi
          echo "image_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Show inputs
        run: |
          {
            echo "### Run details"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| repository | ${{ github.event.repository.name }} |"
            echo "| branch | ${{ github.event.workflow_run.head_branch || github.ref_name }} |"
            echo "| triggered_by | ${{ github.event_name }} |"
            echo "| image_tag | ${{ steps.resolve.outputs.image_tag }} |"
          } >> $GITHUB_STEP_SUMMARY

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: demo-dev

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Create dev namespace
        run: kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy chart to dev
        run: |
          helm upgrade --install ${{ github.event.repository.name }} ./helm/${{ github.event.repository.name }} \
            -f ./helm/${{ github.event.repository.name }}/values-dev.yaml \
            --namespace dev \
            --set image.repository=${{ env.IMAGE_NAME }} \
            --set fullnameOverride=${{ github.event.repository.name }} \
            --set image.tag=${{ steps.resolve.outputs.image_tag }} \
            --wait --timeout 90s

      - name: Show what got deployed
        run: |
          echo "=== Pods in dev ==="
          kubectl get pods -n dev -o wide
          echo
          echo "=== Deployment summary ==="
          kubectl get deployment,svc,hpa -n dev
          echo
          echo "=== Replica count (from values-dev.yaml) ==="
          kubectl get deployment ${{ github.event.repository.name }} -n dev -o jsonpath='{.spec.replicas}'
